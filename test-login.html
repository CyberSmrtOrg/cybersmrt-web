<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Login - CyberSmrt</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      padding: 2rem;
    }

    .test-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    p {
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 1rem;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 0.75rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .warning {
      background: rgba(251, 191, 36, 0.2);
      border: 1px solid rgba(251, 191, 36, 0.5);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🧪 Test Authentication</h1>
    <p>This page simulates a successful OAuth login for testing purposes only.</p>

    <button class="btn" onclick="testLogin()">Simulate Google Login</button>
    <button class="btn" onclick="testAsCurrentUser()">Login as Current User</button>
    <button class="btn" onclick="clearAuth()">Clear Auth & Logout</button>

    <div class="warning">
      ⚠️ <strong>Development Only:</strong> Remove this page before production deployment.
    </div>
  </div>

  <script>
  /* exported testLogin, testAsCurrentUser, clearAuth */
  function testLogin() {
      // Create fake user data matching your actual user structure
      const fakeUser = {
        id: '98f7123c-8cb6-4aba-be3f-a907d5d2e3ac',
        email: 'tony@cybersmrt.org',
        displayName: 'Tony Rossi',
        avatarUrl: 'https://imagedelivery.net/sVNcHMT2LYKnRySpQDxx0A/profile-98f7123c-8cb6-4aba-be3f-a907d5d2e3ac-1760982479039/public',
        role: 'user'
      };

      // Create fake JWT token (just for testing - not secure!)
      const fakeToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5OGY3MTIzYy04Y2I2LTRhYmEtYmUzZi1hOTA3ZDVkMmUzYWMiLCJleHAiOjk5OTk5OTk5OTl9.fake';

      // Store in localStorage
      localStorage.setItem('accessToken', fakeToken);
      localStorage.setItem('refreshToken', 'fake_refreshToken');
      localStorage.setItem('user', JSON.stringify(fakeUser));

      console.log('✅ Test login successful');

      // Redirect to dashboard with user ID
      window.location.href = `/dashboard/${fakeUser.id}`;
    }

  function testAsCurrentUser() {
      const currentUser = localStorage.getItem('user');
      if (currentUser) {
        const user = JSON.parse(currentUser);
        alert(`Logged in as: ${user.displayName || user.email}`);
        window.location.href = `/dashboard/${user.id}`;
      } else {
        alert('No current user found. Use "Simulate Google Login" first.');
      }
    }

  function clearAuth() {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('refreshToken');
      localStorage.removeItem('user');
      localStorage.removeItem('session_id');
      alert('Auth cleared! You are now logged out.');
      window.location.href = '/';
    }
    // Expose functions for inline handlers
    window.testLogin = testLogin;
    window.testAsCurrentUser = testAsCurrentUser;
    window.clearAuth = clearAuth;
  </script>
</body>
</html>
