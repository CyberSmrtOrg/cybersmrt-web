# Cloudflare Workers Configuration for CyberSmrt Auth
# File path: workers/wrangler.toml

name = "cybersmrt-auth"
main = "src/index.js"
compatibility_date = "2024-10-01"

# Worker routes - using subdomain
routes = [
  { pattern = "auth.cybersmrt.org/*", zone_name = "cybersmrt.org" }
]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "cybersmrt-users"
database_id = "fe041848-b5e6-44b9-8de4-a43d4ef4c370"

[[kv_namespaces]]
binding = "USERS"
id = "122705d528ad4f08ac98110cf9133e93"

[[kv_namespaces]]
binding = "SESSIONS"
id = "1a3a4ae612f345c3b152e32e63f28575"

[[kv_namespaces]]
binding = "PASSWORD_RESETS"
id = "570b74fd135c47eaac90a8269761f9cf"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a069251c3a3d48af985e181c581e8d35"

# Environment variables
[vars]
FRONTEND_ORIGIN = "https://cybersmrt.org"
SESSION_EXPIRY = 2592000

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Secrets (set with: wrangler secret put SECRET_NAME)
# - JWT_SECRET
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - GITHUB_CLIENT_ID
# - GITHUB_CLIENT_SECRET
# - MICROSOFT_CLIENT_ID
# - MICROSOFT_CLIENT_SECRET
# - APPLE_CLIENT_ID
# - APPLE_PRIVATE_KEY
# - RESEND_API_KEY

# OAuth Callback URLs (update in OAuth provider dashboards):
# Google: https://auth.cybersmrt.org/callback/google
# GitHub: https://auth.cybersmrt.org/callback/github
# Microsoft: https://auth.cybersmrt.org/callback/microsoft
# Apple: https://auth.cybersmrt.org/callback/apple

# Scheduled events for cleanup
[triggers]
crons = ["0 2 * * *"]  # Run cleanup daily at 2 AM UTC

# Local development
[env.development]
name = "cybersmrt-auth-dev"

[env.development.vars]
FRONTEND_ORIGIN = "http://localhost:8000"
SESSION_EXPIRY = 2592000

# Preview environment
[env.preview]
name = "cybersmrt-auth-preview"

# Production environment (default)
# Uses the settings above