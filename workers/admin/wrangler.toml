name = "cybersmrt-admin"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Admin dashboard worker
# Provides administrative interfaces for managing the CyberSmrt platform

# Production route
[[routes]]
pattern = "admin.cybersmrt.org/*"
zone_name = "cybersmrt.org"

# Environment variables
[env.production]
vars = { FRONTEND_ORIGIN = "https://cybersmrt.org", AUTH_API_URL = "https://auth.cybersmrt.org" }

# KV Namespaces for logging and rate limiting
[[env.production.kv_namespaces]]
binding = "SECURITY_LOGS"
id = "58c8ec0870324a60ba7e8f01fe7f37f5"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "a069251c3a3d48af985e181c581e8d35"  # Shared with auth worker

[env.production.observability]
enabled = true
head_sampling_rate = 1

# Secrets (set via wrangler secret put):
# - JWT_SECRET: Secret key for verifying JWT tokens
# - SLACK_SECURITY_WEBHOOK: Slack webhook URL for #security-alerts channel
# - RESEND_API_KEY: API key for sending email alerts to security-alerts@cybersmrt.org
# - CLOUDFLARE_API_TOKEN: API token for fetching Cloudflare Analytics
