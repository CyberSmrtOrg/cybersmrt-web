<!-- /partials/header.html -->
<header class="site-header" role="banner">
  <style>
    :root {
      --hdr-bg: rgba(6, 10, 22, 0.82);
      --hdr-border: rgba(148,163,184,.18);
      --brand: #8ab4ff;
    }

    /* Orbitron is loaded in the page <head> */
    .nav-logo, .site-brand, .logo-wordmark, .nav-brand span {
      font-family: "Orbitron", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .site-header {
      position: sticky; top: 0; z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--hdr-border);
      background: var(--hdr-bg);
    }

    .site-header .site-nav {
      max-width: 1200px; margin: 0 auto; padding: .65rem 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }

    .site-header .nav-brand {
      display: inline-flex; align-items: center; gap: .6rem;
      color: var(--brand); text-decoration: none;
    }
    .site-header .nav-brand img { display:block; border-radius:6px; }

    .site-header .nav-links { display:flex; gap:1.25rem; align-items:center; }
    .site-header .nav-links a {
      color:#cbd5e1; text-decoration:none; font-weight:600; opacity:.9;
      padding-bottom: 2px;
    }
    .site-header .nav-links a:hover { color:#ffffff; opacity:1; }
    .site-header .nav-links a.is-active,
    .site-header .nav-links a[aria-current="page"] {
      color:#fff; border-bottom:2px solid #60a5fa;
    }

    /* Sign In Button */
    .header-signin-btn {
      background: white;
      color: #667eea;
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .header-signin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
    }

    /* User Menu Dropdown Container */
    .user-menu-container {
      position: relative;
    }

    /* User Menu Button */
    .user-menu {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      border: none;
      font-family: inherit;
      font-size: inherit;
    }
    .user-menu:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
    }
    .user-name {
      font-weight: 600;
    }

    /* Dropdown Arrow */
    .user-menu-arrow {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }
    .user-menu-container.open .user-menu-arrow {
      transform: rotate(180deg);
    }

    /* User Dropdown Menu */
    .user-dropdown {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: rgba(6, 10, 22, 0.95);
      border: 1px solid var(--hdr-border);
      border-radius: 12px;
      min-width: 200px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .user-menu-container.open .user-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .user-dropdown a,
    .user-dropdown button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      color: #cbd5e1;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .user-dropdown a:last-child,
    .user-dropdown button:last-child {
      border-bottom: none;
    }

    .user-dropdown a:hover,
    .user-dropdown button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .user-dropdown button.logout-btn {
      color: #f87171;
    }

    .user-dropdown button.logout-btn:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
    }

    .user-dropdown svg {
      width: 18px;
      height: 18px;
      opacity: 0.8;
    }

    .site-header .nav-toggle{
      display:none; width:40px; height:40px; border:0; background:transparent; position:relative;
    }
    .site-header .nav-toggle span{
      position:absolute; left:9px; right:9px; height:2px; background:#e5e7eb; transition:.2s;
    }
    .site-header .nav-toggle span:nth-child(1){ top:12px; }
    .site-header .nav-toggle span:nth-child(2){ top:19px; }
    .site-header .nav-toggle span:nth-child(3){ top:26px; }

    @media (max-width: 900px){
      .site-header .nav-toggle{ display:block; }
      .site-header .nav-links{
        position:absolute; top:100%; right:0; left:0;
        background: rgba(6,10,22,.96);
        border-bottom:1px solid var(--hdr-border);
        display:none; flex-direction:column; padding:.75rem 1rem; gap:.9rem;
      }
      .site-header .nav-links.show{ display:flex; }
      .header-signin-btn {
        width: 100%;
        max-width: 250px;
      }
      .user-dropdown {
        right: 1rem;
      }
    }
  </style>

  <nav class="site-nav">
    <a class="nav-brand" href="/" aria-label="CyberSmrt home">
      <img src="/assets/logos/cybersmrt-logo-only.png" alt="" width="36" height="36" />
      <span>CYBERSMRT</span>
    </a>

    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-links" role="navigation" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/#programs">Programs</a>
      <a href="/pages/blog/">Blog</a>
      <a href="/pages/about/">About</a>
      <a href="mailto:tony@cybersmrt.org">Contact</a>

      <!-- Sign In Button (shown when NOT logged in) -->
      <button class="header-signin-btn" onclick="openLoginModalSafe()" data-auth-hide>
        Sign In
      </button>

      <!-- User Menu Dropdown (shown when logged in) -->
      <div class="user-menu-container" data-auth-show style="display: none;">
        <button class="user-menu" onclick="toggleUserMenu(event)" aria-haspopup="true" aria-expanded="false">
          <img data-user-avatar src="/assets/logos/cybersmrt-logo-only.png" alt="Profile" class="user-avatar">
          <span data-user-name class="user-name">User</span>
          <svg class="user-menu-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div class="user-dropdown">
          <a href="/dashboard.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Dashboard
          </a>
          <a href="/profile.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Profile
          </a>
          <a href="/settings.html">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Settings
          </a>
          <button onclick="logout()" class="logout-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <script>
    // Toggle user dropdown menu
    function toggleUserMenu(event) {
      event.stopPropagation();
      const container = event.currentTarget.closest('.user-menu-container');
      const isOpen = container.classList.toggle('open');
      event.currentTarget.setAttribute('aria-expanded', isOpen);
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const container = document.querySelector('.user-menu-container');
      if (container && !container.contains(event.target)) {
        container.classList.remove('open');
        const menuBtn = container.querySelector('.user-menu');
        if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // Make globally available
    window.toggleUserMenu = toggleUserMenu;
  </script>
</header>
