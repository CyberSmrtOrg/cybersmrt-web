<!-- /partials/header.html -->
<header class="site-header" role="banner">
  <style>
    :root {
      --hdr-bg: rgba(6, 10, 22, 0.82);
      --hdr-border: rgba(148,163,184,.18);
      --brand: #8ab4ff;
    }

    /* Orbitron is loaded in the page <head> */
    .nav-logo, .site-brand, .logo-wordmark, .nav-brand span {
      font-family: "Orbitron", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .site-header {
      position: sticky; top: 0; z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--hdr-border);
      background: var(--hdr-bg);
    }

    .site-header .site-nav {
      max-width: 1200px; margin: 0 auto; padding: 1rem 1rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }

    .site-header .nav-brand {
      display: inline-flex; align-items: center; gap: .6rem;
      color: var(--brand); text-decoration: none;
    }
    .site-header .nav-brand img { display:block; border-radius:6px; }

    .site-header .nav-links { display:flex; gap:1.25rem; align-items:center; }
    .site-header .nav-links a {
      color:#cbd5e1; text-decoration:none; font-weight:600; opacity:.9;
      padding-bottom: 2px;
    }
    .site-header .nav-links a:hover { color:#ffffff; opacity:1; }
    .site-header .nav-links a.is-active,
    .site-header .nav-links a[aria-current="page"] {
      color:#fff; border-bottom:2px solid #60a5fa;
    }

    /* Sign In Button */
    .header-signin-btn {
      background: white;
      color: #667eea;
      padding: 0.625rem 1.75rem;
      min-height: 44px; /* WCAG 2.1 touch target compliance */
      border-radius: 50px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      /* Improve mobile touch responsiveness */
      -webkit-tap-highlight-color: rgba(102, 126, 234, 0.3);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .header-signin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
    }

    /* User Menu Dropdown Container */
    .user-menu-container {
      position: relative;
      z-index: 1002;
    }

    /* User Menu Button - LARGER & BETTER QUALITY */
    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem 1.5rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      border: none;
      font-family: inherit;
      font-size: inherit;
    }
    .user-menu:hover {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    /* LARGER, BETTER QUALITY AVATAR */
    .user-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      object-fit: cover;
      /* Better image rendering */
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: high-quality;
      /* Smooth scaling */
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .user-avatar:hover {
      border-color: white;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
    }

    .user-name {
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
    }

    /* Dropdown Arrow */
    .user-menu-arrow {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }
    .user-menu-container.open .user-menu-arrow {
      transform: rotate(180deg);
    }

    /* User Dropdown Menu */
    .user-dropdown {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: rgba(6, 10, 22, 0.95);
      border: 1px solid var(--hdr-border);
      border-radius: 12px;
      min-width: 220px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .user-menu-container.open .user-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .user-dropdown a,
    .user-dropdown button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      color: #cbd5e1;
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .user-dropdown a:last-child,
    .user-dropdown button:last-child {
      border-bottom: none;
    }

    .user-dropdown a:hover,
    .user-dropdown button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .user-dropdown button.logout-btn {
      color: #f87171;
    }

    .user-dropdown button.logout-btn:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
    }

    .user-dropdown svg {
      width: 18px;
      height: 18px;
      opacity: 0.8;
    }

    /* Tools Dropdown */
    .tools-dropdown-container {
      position: relative;
    }

    .tools-dropdown-trigger {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
      opacity: 0.9;
      padding-bottom: 2px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }

    .tools-dropdown-trigger:hover {
      color: #ffffff;
      opacity: 1;
    }

    .tools-dropdown-arrow {
      width: 14px;
      height: 14px;
      transition: transform 0.3s ease;
    }

    .tools-dropdown-container.open .tools-dropdown-arrow {
      transform: rotate(180deg);
    }

    .tools-dropdown {
      position: absolute;
      top: calc(100% + 0.5rem);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 10, 22, 0.95);
      border: 1px solid var(--hdr-border);
      border-radius: 12px;
      min-width: 200px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .tools-dropdown-container.open .tools-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .tools-dropdown a {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.25rem;
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
    }

    .tools-dropdown a:last-child {
      border-bottom: none;
    }

    .tools-dropdown a:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .tools-dropdown svg {
      width: 18px;
      height: 18px;
      opacity: 0.8;
    }

    .site-header .nav-toggle{
      display:none; width:40px; height:40px; border:0; background:transparent; position:relative;
    }
    .site-header .nav-toggle span{
      position:absolute; left:9px; right:9px; height:2px; background:#e5e7eb; transition:.2s;
    }
    .site-header .nav-toggle span:nth-child(1){ top:12px; }
    .site-header .nav-toggle span:nth-child(2){ top:19px; }
    .site-header .nav-toggle span:nth-child(3){ top:26px; }

    @media (max-width: 900px){
      .site-header .nav-toggle{ display:block; }
      .site-header .nav-links{
        position:absolute; top:100%; right:0; left:0;
        background: rgba(6,10,22,.96);
        border-bottom:1px solid var(--hdr-border);
        display:none; flex-direction:column; padding:.75rem 1rem; gap:.9rem;
      }
      .site-header .nav-links.show{ display:flex; }
      .header-signin-btn {
        width: 100%;
        max-width: 250px;
        min-height: 52px; /* Larger touch target on mobile */
        padding: 0.875rem 1.75rem;
        font-size: 1rem;
      }
      .user-dropdown {
        right: 1rem;
      }
      .user-name {
        display: none;
      }
      /* Keep avatar large on mobile */
      .user-avatar {
        width: 48px;
        height: 48px;
      }
    }
  </style>

      <!-- Theme Toggle Button -->
      <button class="theme-toggle" onclick="window.ThemeManager.toggle()" aria-label="Toggle theme" title="Toggle light/dark mode">
        <div class="theme-toggle-icon dark-icon">🌙</div>
        <div class="theme-toggle-icon light-icon">☀️</div>

      <!-- Sign In Button (shown when NOT logged in) -->
