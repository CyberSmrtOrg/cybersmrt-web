<header class="site-header" role="banner">
  <style>
    /* Header theme variables - adapt to light/dark mode */
    :root {
      --hdr-util-bg: rgba(6, 10, 22, 0.95);
      --hdr-bg: rgba(6, 10, 22, 0.82);
      --hdr-border: rgba(148,163,184,.18);
      --brand: #8ab4ff;
      --hdr-text: #cbd5e1;
      --hdr-text-hover: #ffffff;
    }

    [data-theme="light"] {
      --hdr-util-bg: rgba(248, 250, 252, 0.98);
      --hdr-bg: rgba(248, 250, 252, 0.9);
      --hdr-border: rgba(148,163,184,.3);
      --brand: #4299e1;
      --hdr-text: #475569;
      --hdr-text-hover: #1e293b;
    }

    /* Orbitron is loaded in the page <head> */
    .nav-logo, .site-brand, .logo-wordmark, .nav-brand span {
      font-family: "Orbitron", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, sans-serif;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .site-header {
      position: sticky; top: 0; z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* =========================== */
    /* TOP UTILITY BAR */
    /* =========================== */
    .header-utility-bar {
      background: var(--hdr-util-bg);
      border-bottom: 1px solid var(--hdr-border);
      padding: 0.5rem 0;
    }

    .header-utility-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem;
    }

    .header-utility-search {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--hdr-text);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .header-utility-search:hover {
      color: var(--hdr-text-hover);
      background: rgba(255, 255, 255, 0.05);
    }

    .header-utility-search svg {
      width: 18px;
      height: 18px;
    }

    /* Theme Toggle in Utility Bar */
    .header-theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .header-theme-toggle:hover {
      background: var(--card-bg-hover);
      border-color: var(--brand);
      transform: translateY(-2px);
    }

    .header-theme-toggle .theme-toggle-icon {
      font-size: 1.1rem;
    }

    /* My Account Dropdown in Utility Bar */
    .header-account-dropdown {
      position: relative;
    }

    .header-account-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--hdr-text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .header-account-btn:hover {
      color: var(--hdr-text-hover);
      background: rgba(255, 255, 255, 0.05);
    }

    .header-account-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .header-account-dropdown.open .header-account-btn svg {
      transform: rotate(180deg);
    }

    /* Sign In Button */
    .header-signin-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .header-signin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    /* Account Dropdown Menu */
    .header-account-menu {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: var(--hdr-bg);
      border: 1px solid var(--hdr-border);
      border-radius: 12px;
      min-width: 220px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1001;
    }

    .header-account-dropdown.open .header-account-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .header-account-menu a,
    .header-account-menu button {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.875rem 1.25rem;
      color: var(--hdr-text);
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      border-bottom: 1px solid var(--border-color);
    }

    .header-account-menu a:last-child,
    .header-account-menu button:last-child {
      border-bottom: none;
    }

    .header-account-menu a:hover,
    .header-account-menu button:hover {
      background: var(--card-bg-hover);
      color: var(--hdr-text-hover);
    }

    .header-account-menu button.logout-btn {
      color: #f87171;
    }

    .header-account-menu button.logout-btn:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
    }

    .header-account-menu svg {
      width: 18px;
      height: 18px;
      opacity: 0.8;
    }

    /* =========================== */
    /* MAIN NAVIGATION BAR */
    /* =========================== */
    .header-nav-bar {
      background: var(--hdr-bg);
      border-bottom: 1px solid var(--hdr-border);
    }

    .header-nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      color: var(--brand);
      text-decoration: none;
    }

    .nav-brand img {
      display:block;
      border-radius:6px;
    }

    .nav-links {
      display:flex;
      gap:1.25rem;
      align-items:center;
    }

    .nav-links a,
    .nav-links button {
      color: var(--hdr-text);
      text-decoration:none;
      font-weight:600;
      opacity:.9;
      padding-bottom: 2px;
      background: none;
      border: none;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }

    .nav-links a:hover,
    .nav-links button:hover {
      color: var(--hdr-text-hover);
      opacity:1;
    }

    .nav-links a.is-active,
    .nav-links a[aria-current="page"] {
      color: var(--hdr-text-hover);
      border-bottom:2px solid var(--brand);
    }

    /* Donate Button */
    .header-donate-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: white !important;
      padding: 0.625rem 1.5rem;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .header-donate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
      color: white !important;
      opacity: 1 !important;
    }

    .header-donate-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Members Dropdown Button */
    .members-dropdown-container {
      position: relative;
    }

    .members-dropdown-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--hdr-text);
      text-decoration: none;
      font-weight: 600;
      opacity: 0.9;
      padding: 0.625rem 1.25rem;
      background: rgba(102, 126, 234, 0.1);
      border: 1px solid rgba(102, 126, 234, 0.3);
      border-radius: 8px;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .members-dropdown-btn:hover {
      color: var(--hdr-text-hover);
      opacity: 1;
      background: rgba(102, 126, 234, 0.2);
      border-color: rgba(102, 126, 234, 0.5);
    }

    .members-dropdown-arrow {
      width: 14px;
      height: 14px;
      transition: transform 0.3s ease;
    }

    .members-dropdown-container.open .members-dropdown-arrow {
      transform: rotate(180deg);
    }

    /* Members Mega Menu Panel */
    .members-mega-menu {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: var(--hdr-bg);
      border: 1px solid var(--hdr-border);
      border-radius: 12px;
      width: 720px;
      max-width: 90vw;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1001;
      padding: 2rem;
    }

    .members-dropdown-container.open .members-mega-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .members-mega-menu-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--hdr-text);
      opacity: 0.7;
      margin-bottom: 1rem;
    }

    .members-mega-menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    .members-mega-menu-section h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--hdr-text-hover);
      margin: 0 0 0.75rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--brand);
    }

    .members-mega-menu-section a {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0;
      color: var(--hdr-text);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .members-mega-menu-section a:hover {
      color: var(--hdr-text-hover);
      transform: translateX(5px);
    }

    .members-mega-menu-section svg {
      width: 16px;
      height: 16px;
      opacity: 0.8;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Mobile Navigation Toggle */
    .nav-toggle{
      display:none;
      width:40px;
      height:40px;
      border:0;
      background:transparent;
      position:relative;
      z-index:1005;
      cursor:pointer;
    }

    .nav-toggle span{
      position:absolute;
      left:9px;
      right:9px;
      height:2px;
      background:#e5e7eb;
      transition:.2s;
    }

    .nav-toggle span:nth-child(1){ top:12px; }
    .nav-toggle span:nth-child(2){ top:19px; }
    .nav-toggle span:nth-child(3){ top:26px; }

    /* Mobile Responsive */
    @media (max-width: 900px){
      .header-utility-bar {
        display: none; /* Hide utility bar on mobile */
      }

      .nav-toggle{
        display:block;
      }

      .nav-links{
        position:absolute;
        top:100%;
        right:0;
        left:0;
        background: rgba(6,10,22,.96);
        border-bottom:1px solid var(--hdr-border);
        display:none;
        flex-direction:column;
        padding:.75rem 1rem;
        gap:.9rem;
        z-index:1004;
      }

      .nav-links.show{
        display:flex;
      }

      .header-donate-btn {
        width: 100%;
        max-width: 250px;
        padding: 0.875rem 1.75rem;
        font-size: 1rem;
        justify-content: center;
      }

      .members-dropdown-btn {
        width: 100%;
        max-width: 250px;
        justify-content: center;
      }

      .members-mega-menu {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        border-radius: 0;
        padding: 1.5rem 1rem;
        overflow-y: auto;
      }

      .members-mega-menu-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .header-account-menu {
        right: 1rem;
      }
    }
  </style>

<script>
// Members dropdown toggle
function toggleMembersDropdown(event) {
  event.stopPropagation();
  const container = event.currentTarget.closest('.members-dropdown-container');
  container.classList.toggle('open');

  const button = container.querySelector('.members-dropdown-btn');
  const isOpen = container.classList.contains('open');
  button.setAttribute('aria-expanded', isOpen);
}

// Account dropdown toggle
function toggleAccountDropdown(event) {
  event.stopPropagation();
  const container = event.currentTarget.closest('.header-account-dropdown');
  container.classList.toggle('open');

  const button = container.querySelector('.header-account-btn');
  const isOpen = container.classList.contains('open');
  button.setAttribute('aria-expanded', isOpen);
}

// Close dropdowns when clicking outside
document.addEventListener('click', () => {
  // Close members dropdown
  const openMembersDropdowns = document.querySelectorAll('.members-dropdown-container.open');
  openMembersDropdowns.forEach(dropdown => {
    dropdown.classList.remove('open');
    const button = dropdown.querySelector('.members-dropdown-btn');
    button.setAttribute('aria-expanded', 'false');
  });

  // Close account dropdown
  const openAccountDropdowns = document.querySelectorAll('.header-account-dropdown.open');
  openAccountDropdowns.forEach(dropdown => {
    dropdown.classList.remove('open');
    const button = dropdown.querySelector('.header-account-btn');
    button.setAttribute('aria-expanded', 'false');
  });
});

// Mobile menu toggle
document.querySelector('.nav-toggle')?.addEventListener('click', function() {
  const navLinks = document.querySelector('.nav-links');
  navLinks.classList.toggle('show');
  const isOpen = navLinks.classList.contains('show');
  this.setAttribute('aria-expanded', isOpen);
});

// Make functions globally available
window.toggleMembersDropdown = toggleMembersDropdown;
window.toggleAccountDropdown = toggleAccountDropdown;
</script>
