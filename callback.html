<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing Sign In - CyberSmrt</title>
  <link rel="icon" href="/assets/logos/cybersmrt-logo-only.png" type="image/png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0f23 0%, #090d1c 60%, #070b18 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #667eea;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .spinner {
      width: 60px;
      height: 60px;
      margin: 2rem auto;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      color: #94a3b8;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1.5rem;
      color: #fca5a5;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1.5rem;
      color: #86efac;
    }

    .provider-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      opacity: 0.8;
    }

    .twofa-form {
      display: none;
      text-align: left;
      margin-top: 1.5rem;
    }

    .twofa-form.show {
      display: block;
    }

    .twofa-form input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;
      color: white;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      font-family: 'Courier New', monospace;
    }

    .twofa-form input:focus {
      outline: none;
      border-color: #667eea;
    }

    .twofa-form button {
      width: 100%;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .twofa-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(96, 165, 250, 0.3);
    }

    .twofa-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .twofa-form p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .twofa-form label {
      display: block;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="provider-icon"></div>
    <h2 id="title">Completing sign in...</h2>
    <div class="spinner" id="spinner"></div>
    <div id="status">Verifying your authentication...</div>

    <!-- 2FA Verification Form -->
    <div id="twofa-form" class="twofa-form">
      <p>Two-factor authentication is required for your account.</p>
      <label for="twofa-code">Enter your 6-digit code or backup code:</label>
      <input
        type="text"
        id="twofa-code"
        placeholder="000000"
        maxlength="9"
        autocomplete="off"
      />
      <button id="verify-btn" onclick="verify2FA()">Verify</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const titleEl = document.getElementById('title');
    const providerIconEl = document.getElementById('provider-icon');
    const twoFAFormEl = document.getElementById('twofa-form');

    // Store pending auth data globally
    let pendingAuthData = null;

    // Detect provider from URL
    const urlParams = new URLSearchParams(window.location.search);
    const provider = urlParams.get('provider') || '';

    // Set provider icon
    if (provider) {
      const icons = {
        google: '🔴',
        github: '⚫',
        microsoft: '🔷'
      };
      if (icons[provider]) {
        providerIconEl.innerHTML = `<div style="font-size: 48px;">${icons[provider]}</div>`;
      }
    }

    // Handle OAuth callback
    const hash = window.location.hash.substring(1);

    if (hash) {
      try {
        statusEl.textContent = 'Processing authentication response...';

        // Decode the base64 hash data
        const data = JSON.parse(atob(hash));

        // Check if 2FA is required
        if (data.requires2FA) {
          // Store pending auth data
          pendingAuthData = data;

          // Show 2FA form
          spinnerEl.style.display = 'none';
          titleEl.textContent = 'Two-Factor Authentication';
          statusEl.style.display = 'none';
          twoFAFormEl.classList.add('show');

          // Focus on input
          document.getElementById('twofa-code').focus();

          // Set provider icon if available
          if (data.provider) {
            const icons = {
              google: '🔴',
              github: '⚫',
              microsoft: '🔷'
            };
            if (icons[data.provider]) {
              providerIconEl.innerHTML = `<div style="font-size: 48px;">${icons[data.provider]}</div>`;
            }
          }

          // Don't continue processing - wait for 2FA
        } else if (data.success) {
          statusEl.textContent = 'Success! Redirecting...';

          // Store authentication data - use camelCase keys to match auth.js
          localStorage.setItem('accessToken', data.tokens.accessToken);
          localStorage.setItem('refreshToken', data.tokens.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.user));

          if (data.session && data.session.id) {
            localStorage.setItem('sessionId', data.session.id);
          }

          // Show success message
          spinnerEl.style.display = 'none';
          statusEl.className = 'success';
          statusEl.innerHTML = `✓ Authentication successful!<br>Welcome ${data.user.displayName || data.user.email}`;

          // Determine redirect location
          let redirectUrl = '/profile';

          // Check if there's a saved return URL
          const savedReturnUrl = localStorage.getItem('loginReturnUrl');
          console.log('[OAuth Callback] Saved return URL:', savedReturnUrl);
          console.log('[OAuth Callback] Current origin:', window.location.origin);

          if (savedReturnUrl) {
            // Parse the URL to ensure it's on the same origin
            try {
              const returnUrlObj = new URL(savedReturnUrl);
              const currentOrigin = window.location.origin;

              console.log('[OAuth Callback] Return URL origin:', returnUrlObj.origin);
              console.log('[OAuth Callback] Origins match:', returnUrlObj.origin === currentOrigin);

              // Only use saved URL if it's from the same origin
              if (returnUrlObj.origin === currentOrigin) {
                redirectUrl = savedReturnUrl;
                console.log('[OAuth Callback] Using saved return URL:', redirectUrl);
              } else {
                console.log('[OAuth Callback] Origin mismatch, using default /profile');
              }
            } catch (e) {
              // If URL parsing fails, use default
              console.log('[OAuth Callback] Could not parse saved return URL:', e);
            }

            // Clear the saved return URL
            localStorage.removeItem('loginReturnUrl');
          } else {
            console.log('[OAuth Callback] No saved return URL found, checking user status');
            // Check if user needs to complete setup or verify email
            if (data.user.email_verified === false || data.user.emailVerified === false) {
              redirectUrl = '/profile?verify=true';
              console.log('[OAuth Callback] Email not verified, redirecting to:', redirectUrl);
            } else if (!data.user.displayName) {
              redirectUrl = '/profile?setup=true';
              console.log('[OAuth Callback] Display name missing, redirecting to:', redirectUrl);
            }
          }

          console.log('[OAuth Callback] Final redirect URL:', redirectUrl);

          // Redirect after a short delay - use replace for full reload
          setTimeout(() => {
            window.location.replace(redirectUrl);
          }, 1500);

        } else {
          // Authentication failed
          handleError(data.error || 'Authentication failed', false);
        }

      } catch (error) {
        console.error('OAuth callback error:', error);
        handleError('Failed to process authentication response. Please try again.', true);
      }
    } else {
      // No hash data found
      handleError('No authentication data received. Please try signing in again.', false);
    }

    // Verify 2FA code
    async function verify2FA() {
      if (!pendingAuthData) {
        handleError('No pending authentication found', false);
        return;
      }

      const code = document.getElementById('twofa-code').value.trim();

      if (!code) {
        statusEl.style.display = 'block';
        statusEl.className = 'error';
        statusEl.textContent = 'Please enter your verification code';
        return;
      }

      // Disable button
      const btn = document.getElementById('verify-btn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const response = await fetch('https://auth.cybersmrt.org/2fa/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({
            userId: pendingAuthData.userId,
            code: code,
            pendingAuthId: pendingAuthData.pendingAuthId,
          }),
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Verification failed');
        }

        if (result.success && result.verified) {
          // Store authentication data - use camelCase keys to match auth.js
          localStorage.setItem('accessToken', result.tokens.accessToken);
          localStorage.setItem('refreshToken', result.tokens.refreshToken);
          localStorage.setItem('user', JSON.stringify(result.user));

          if (result.session && result.session.id) {
            localStorage.setItem('sessionId', result.session.id);
          }

          // Show success message
          twoFAFormEl.style.display = 'none';
          titleEl.textContent = 'Authentication Complete';
          statusEl.style.display = 'block';
          statusEl.className = 'success';
          statusEl.innerHTML = `✓ Successfully authenticated!<br>Welcome ${result.user.displayName || result.user.email}`;

          // Determine redirect location
          let redirectUrl = '/profile';

          // Check if there's a saved return URL
          const savedReturnUrl = localStorage.getItem('loginReturnUrl');
          console.log('[2FA Callback] Saved return URL:', savedReturnUrl);
          console.log('[2FA Callback] Current origin:', window.location.origin);

          if (savedReturnUrl) {
            // Parse the URL to ensure it's on the same origin
            try {
              const returnUrlObj = new URL(savedReturnUrl);
              const currentOrigin = window.location.origin;

              console.log('[2FA Callback] Return URL origin:', returnUrlObj.origin);
              console.log('[2FA Callback] Origins match:', returnUrlObj.origin === currentOrigin);

              // Only use saved URL if it's from the same origin
              if (returnUrlObj.origin === currentOrigin) {
                redirectUrl = savedReturnUrl;
                console.log('[2FA Callback] Using saved return URL:', redirectUrl);
              } else {
                console.log('[2FA Callback] Origin mismatch, using default /profile');
              }
            } catch (e) {
              // If URL parsing fails, use default
              console.log('[2FA Callback] Could not parse saved return URL:', e);
            }

            // Clear the saved return URL
            localStorage.removeItem('loginReturnUrl');
          } else {
            console.log('[2FA Callback] No saved return URL found');
          }

          console.log('[2FA Callback] Final redirect URL:', redirectUrl);

          // Redirect after a short delay - use window.location.replace for full reload
          setTimeout(() => {
            window.location.replace(redirectUrl);
          }, 1500);
        } else {
          throw new Error('Verification failed');
        }
      } catch (error) {
        console.error('2FA verification error:', error);
        statusEl.style.display = 'block';
        statusEl.className = 'error';
        statusEl.textContent = error.message || 'Invalid verification code. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Verify';
      }
    }

    // Allow Enter key to submit
    document.getElementById('twofa-code')?.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        verify2FA();
      }
    });

    function handleError(message, isException) {
      spinnerEl.style.display = 'none';
      titleEl.textContent = 'Authentication Error';
      titleEl.style.color = '#ef4444';
      statusEl.className = 'error';
      statusEl.innerHTML = `✗ ${message}`;

      // Log additional details for debugging
      if (isException) {
        console.error('Exception during OAuth callback processing');
      }

      // Redirect to login page after delay
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 3000);
    }
  </script>
</body>
</html>
