<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing Sign In - CyberSmrt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0f23 0%, #090d1c 60%, #070b18 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #667eea;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .spinner {
      width: 60px;
      height: 60px;
      margin: 2rem auto;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status {
      color: #94a3b8;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1.5rem;
      color: #fca5a5;
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1.5rem;
      color: #86efac;
    }

    .provider-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="provider-icon"></div>
    <h2 id="title">Completing sign in...</h2>
    <div class="spinner" id="spinner"></div>
    <div id="status">Verifying your authentication...</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const titleEl = document.getElementById('title');
    const providerIconEl = document.getElementById('provider-icon');

    // Detect provider from URL
    const urlParams = new URLSearchParams(window.location.search);
    const provider = urlParams.get('provider') || '';

    // Set provider icon
    if (provider) {
      const icons = {
        google: '🔴',
        github: '⚫',
        microsoft: '🔷',
        apple: '🍎'
      };
      if (icons[provider]) {
        providerIconEl.innerHTML = `<div style="font-size: 48px;">${icons[provider]}</div>`;
      }
    }

    // Handle OAuth callback
    const hash = window.location.hash.substring(1);

    if (hash) {
      try {
        statusEl.textContent = 'Processing authentication response...';

        // Decode the base64 hash data
        const data = JSON.parse(atob(hash));

        if (data.success) {
          statusEl.textContent = 'Success! Redirecting...';

          // Store authentication data
          localStorage.setItem('accessToken', data.tokens.accessToken);
          localStorage.setItem('refreshToken', data.tokens.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.user));

          if (data.session && data.session.id) {
            localStorage.setItem('sessionId', data.session.id);
          }

          // Show success message
          spinnerEl.style.display = 'none';
          statusEl.className = 'success';
          statusEl.innerHTML = `✓ Authentication successful!<br>Welcome ${data.user.display_name || data.user.email}`;

          // Determine redirect location
          let redirectUrl = '/profile.html';

          // Check if user needs to complete setup or verify email
          if (data.user.email_verified === false || data.user.emailVerified === false) {
            redirectUrl = '/profile.html?verify=true';
          } else if (!data.user.display_name) {
            redirectUrl = '/profile.html?setup=true';
          }

          // Redirect after a short delay
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 1500);

        } else {
          // Authentication failed
          handleError(data.error || 'Authentication failed', false);
        }

      } catch (error) {
        console.error('OAuth callback error:', error);
        handleError('Failed to process authentication response. Please try again.', true);
      }
    } else {
      // No hash data found
      handleError('No authentication data received. Please try signing in again.', false);
    }

    function handleError(message, isException) {
      spinnerEl.style.display = 'none';
      titleEl.textContent = 'Authentication Error';
      titleEl.style.color = '#ef4444';
      statusEl.className = 'error';
      statusEl.innerHTML = `✗ ${message}`;

      // Log additional details for debugging
      if (isException) {
        console.error('Exception during OAuth callback processing');
      }

      // Redirect to login page after delay
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 3000);
    }
  </script>
</body>
</html>
