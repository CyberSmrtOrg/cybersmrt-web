<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing In... - CyberSmrt</title>

    <!-- Orbitron Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .callback-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            margin-bottom: 0.5rem;
        }

        .success {
            color: #16a34a;
            font-weight: 600;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            color: #c33;
        }

        .error-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .retry-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .retry-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner" id="spinner"></div>
        <h1 id="status">Signing you in...</h1>
        <p id="message">Please wait while we complete authentication</p>
        <div id="error" class="error" style="display: none;">
            <div class="error-title">Authentication Failed</div>
            <div id="error-message"></div>
            <a href="/" class="retry-btn">Go Home</a>
        </div>
    </div>

    <script>
        async function handleCallback() {
            try {
                // Get data from URL hash
                const hash = window.location.hash.substring(1); // Remove # symbol

                if (!hash) {
                    throw new Error('No authentication data received');
                }

                console.log('Processing OAuth callback...');

                // Decode base64 data
                const jsonString = atob(hash);
                const data = JSON.parse(jsonString);

                if (!data.success) {
                    throw new Error(data.error || 'Authentication failed');
                }

                // Store tokens and user data
                localStorage.setItem('access_token', data.tokens.accessToken);
                localStorage.setItem('refresh_token', data.tokens.refreshToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('session_id', data.session.id);

                console.log('✅ Authentication successful!');

                // Update UI
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('status').textContent = 'Success!';
                document.getElementById('status').className = 'success';
                document.getElementById('message').textContent = `Welcome, ${data.user.displayName}!`;

                // Redirect to homepage after brief delay
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);

            } catch (err) {
                console.error('Callback error:', err);
                showError(err.message || 'An unexpected error occurred');
            }
        }

        function showError(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Oops!';
            document.getElementById('message').style.display = 'none';
            document.getElementById('error-message').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        // Run on page load
        handleCallback();
    </script>
</body>
</html>
