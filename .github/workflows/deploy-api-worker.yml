name: Deploy API Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - 'workers/shared/**'
      - '.github/workflows/deploy-api-worker.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test API Worker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'workers/api/package.json'

      - name: Install dependencies
        working-directory: workers/api
        run: npm ci

      - name: Run linting
        working-directory: workers/api
        run: npm run lint --if-present

      - name: Run tests
        working-directory: workers/api
        run: npm test --if-present

      - name: Security audit
        working-directory: workers/api
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    name: Deploy API Worker
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'workers/api/package.json'

      - name: Install worker dependencies
        working-directory: workers/api
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: workers/api
        run: |
          echo "Deploying API worker..."
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for deployment propagation
        run: sleep 10

      - name: Health check
        run: |
          RESPONSE=$(curl -s https://api.cybersmrt.org/health)
          echo "Health check response: $RESPONSE"

          # Verify JSON response contains "status": "healthy"
          if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi

      - name: Test critical endpoints
        run: |
          # Test API documentation endpoint
          curl -f https://api.cybersmrt.org/ || exit 1

          # Test contact config endpoint
          curl -f https://api.cybersmrt.org/contact/config || exit 1

          echo "Note: Authenticated endpoints require valid JWT token"
          echo "Endpoints tested:"
          echo "  ✅ GET /health"
          echo "  ✅ GET / (API documentation)"
          echo "  ✅ GET /contact/config"

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ API Worker deployed successfully!"
          echo "🔗 Health: https://api.cybersmrt.org/health"
          echo "📚 Docs: https://api.cybersmrt.org/"
          echo "🎯 Endpoints:"
          echo "  - GET/PUT /profile"
          echo "  - GET /dashboard"
          echo "  - GET/PUT /settings"
          echo "  - POST /contact"
          echo "  - GET /contact/config"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ API Worker deployment failed!"
          echo "Review logs and consider rollback if needed."
          echo "Rollback command: npx wrangler rollback --name cybersmrt-api"
