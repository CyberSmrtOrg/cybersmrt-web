name: Sync Store Header

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths:
      - 'partials/header.html'
      - 'sync-store-header.sh'
  workflow_dispatch:

jobs:
  sync-header:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run header sync script
        run: |
          chmod +x sync-store-header.sh
          bash sync-store-header.sh

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check for changes in the store header file
          if ! git diff --quiet store/partials/header.html || ! git diff --cached --quiet store/partials/header.html; then
            echo "📝 Changes detected in store header"

            # Show all changes for debugging
            echo "All modified files:"
            git status --short

            # Fetch latest changes before committing
            git fetch origin main

            # Stage and commit only the store header changes
            git add store/partials/header.html

            # Check if there are still unstaged changes after adding the header
            if ! git diff --quiet || ! git diff --cached --quiet --diff-filter=M; then
              echo "📦 Other changes detected, will commit only the header"
            fi

            git commit -m "🤖 Auto-sync: Update store header from main header

            Automatically synced by GitHub Actions when partials/header.html changed.
            URLs updated to point to main site (https://cybersmrt.org) instead of root.

            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            # Try to push with retry logic using merge instead of rebase
            max_attempts=3
            attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "🚀 Push attempt $attempt of $max_attempts"

              # Use merge strategy instead of rebase (more forgiving with partial commits)
              if git pull --no-rebase origin main && git push origin main; then
                echo "✅ Push successful!"
                break
              fi

              echo "⚠️  Attempt $attempt failed, retrying..."
              attempt=$((attempt + 1))
              sleep 2
            done

            if [ $attempt -gt $max_attempts ]; then
              echo "❌ Failed to push after $max_attempts attempts"
              exit 1
            fi
          else
            echo "✨ No changes to commit"
          fi
