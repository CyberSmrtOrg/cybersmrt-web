<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Tools Dropdown</title>
</head>
<body>
  <h1>Test Tools Dropdown</h1>

  <!-- Shared Header -->
  <div id="header-mount"></div>
  <script src="/assets/js/header-loader.js?v=1"></script>

  <div style="padding: 20px; margin-top: 100px;">
    <p>Click the Tools dropdown in the header above. Open the browser console (F12) to see any errors.</p>
    <p>You should see: "✅ Global functions loaded (including toggleUserMenu, toggleToolsDropdown)"</p>
  </div>

  <script>
    // Test if function exists
    setTimeout(() => {
      console.log('Testing toggleToolsDropdown availability...');
      console.log('window.toggleToolsDropdown exists:', typeof window.toggleToolsDropdown);
      console.log('window.toggleUserMenu exists:', typeof window.toggleUserMenu);

      if (typeof window.toggleToolsDropdown === 'undefined') {
        console.error('❌ toggleToolsDropdown is not defined!');
      } else {
        console.log('✅ toggleToolsDropdown is available');
      }
    }, 2000);
  </script>
</body>
</html>
