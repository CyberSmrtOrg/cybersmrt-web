<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CyberSmrt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/fix-dark-bar.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; min-height: 100vh; padding-top: 90px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    .page-header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tabs { display: flex; gap: 1rem; margin: 2rem 0; border-bottom: 2px solid rgba(148, 163, 184, 0.18); overflow-x: auto; }
    .tab { padding: 0.75rem 1.5rem; background: none; border: none; color: #94a3b8; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; }
    .card h2 { font-size: 1.5rem; color: white; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; color: #cbd5e1; margin-bottom: 0.5rem; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 8px; color: white; font-size: 1rem; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%); color: white; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 8px; padding: 1rem; }
    .stat-label { color: #94a3b8; font-size: 0.875rem; margin-bottom: 0.5rem; }
    .stat-value { color: white; font-size: 1.25rem; font-weight: 600; }
    .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge.success { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .badge.warning { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    .badge.danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .log-list { max-height: 500px; overflow-y: auto; }
    .log-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(148, 163, 184, 0.1); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .log-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    .log-type { font-weight: 600; color: #60a5fa; }
    .log-time { color: #64748b; font-size: 0.875rem; }
    .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: none; }
    .alert.show { display: block; }
    .alert.success { background: rgba(34, 197, 94, 0.2); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; }
    .alert.error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .danger-zone { border: 2px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <script defer src="/assets/js/header-loader.js"></script>

  <div class="container">
    <div class="page-header">
      <h1>Profile Settings</h1>
      <p id="welcome-text">Manage your account</p>
    </div>
    <div id="alert" class="alert"></div>
    <div class="tabs">
      <button class="tab active" data-tab="profile">Profile</button>
      <button class="tab" data-tab="account">Account</button>
      <button class="tab" data-tab="security">Security</button>
      <button class="tab" data-tab="data">Data</button>
    </div>

    <div id="profile-tab" class="tab-content active">
      <div class="card">
        <h2>Avatar</h2>
        <div style="display: flex; align-items: center; gap: 2rem; margin-bottom: 1.5rem;">
          <div style="position: relative;">
            <img id="current-avatar" src="" alt="Avatar" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(148, 163, 184, 0.3);">
            <div id="avatar-placeholder" style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: white; border: 2px solid rgba(148, 163, 184, 0.3);"></div>
          </div>
          <div style="flex: 1;">
            <p style="color: #94a3b8; margin-bottom: 1rem;">Upload a profile picture. JPG, PNG, GIF, or WebP. Max 2MB.</p>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <label class="btn btn-primary" style="cursor: pointer;">
                <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;">
                Choose File
              </label>
              <button id="upload-avatar-btn" class="btn btn-primary" style="display: none;">Upload</button>
              <button id="delete-avatar-btn" class="btn btn-danger" style="display: none;">Delete Avatar</button>
            </div>
            <div id="avatar-preview-container" style="margin-top: 1rem; display: none;">
              <img id="avatar-preview" src="" alt="Preview" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 1px solid rgba(148, 163, 184, 0.3);">
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Edit Profile</h2>
        <form id="profile-form">
          <div class="form-group"><label>Display Name</label><input type="text" id="displayName" maxlength="100"></div>
          <div class="form-group"><label>Bio</label><textarea id="bio" maxlength="500"></textarea></div>
          <div class="form-group"><label>Location</label><input type="text" id="location" maxlength="100"></div>
          <div class="form-group"><label>Website</label><input type="url" id="website" maxlength="200"></div>
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </div>
    </div>

    <div id="account-tab" class="tab-content">
      <div class="card">
        <h2>Account</h2>
        <div class="stat-grid">
          <div class="stat-item"><div class="stat-label">Email</div><div class="stat-value" id="account-email">---</div></div>
          <div class="stat-item"><div class="stat-label">Verified</div><div class="stat-value" id="email-verified">---</div></div>
          <div class="stat-item"><div class="stat-label">2FA</div><div class="stat-value" id="2fa-status">---</div></div>
          <div class="stat-item"><div class="stat-label">Sessions</div><div class="stat-value" id="active-sessions">---</div></div>
        </div>
        <div style="margin-top: 1.5rem;"><h3 style="color: white; margin-bottom: 1rem;">Providers</h3><div id="providers-list"></div></div>
        <div style="margin-top: 2rem;"><a href="/2fa-settings.html" class="btn btn-primary">Manage 2FA</a></div>
      </div>
    </div>

    <div id="security-tab" class="tab-content">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="margin: 0;">Security Activity</h2>
          <div style="display: flex; gap: 0.5rem;">
            <button id="export-csv-btn" class="btn btn-primary" style="padding: 0.5rem 1rem;">Export CSV</button>
            <button id="export-json-btn" class="btn btn-primary" style="padding: 0.5rem 1rem;">Export JSON</button>
          </div>
        </div>
        <div id="security-logs" class="log-list">Loading...</div>
      </div>
    </div>

    <div id="data-tab" class="tab-content">
      <div class="card"><h2>Export Data</h2><p style="color: #94a3b8; margin-bottom: 1.5rem;">GDPR-compliant data export</p><button id="export-btn" class="btn btn-primary">Export</button></div>
      <div class="card danger-zone">
        <h2>Delete Account</h2>
        <div class="form-group"><label>Type "DELETE MY ACCOUNT"</label><input type="text" id="delete-confirm"></div>
        <div class="form-group"><label>Password</label><input type="password" id="delete-password"></div>
        <button id="delete-account-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'https://profile.cybersmrt.org';
    const token = () => localStorage.getItem('access_token');
    if (!token()) window.location.href = '/login.html';

    const showAlert = (msg, type = 'success') => {
      const alert = document.getElementById('alert');
      alert.textContent = msg;
      alert.className = `alert ${type} show`;
      setTimeout(() => alert.classList.remove('show'), 5000);
    };

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
      });
    });

    fetch(`${API}/profile`, { headers: { 'Authorization': `Bearer ${token()}` } })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          document.getElementById('displayName').value = d.profile.displayName || '';
          document.getElementById('bio').value = d.profile.bio || '';
          document.getElementById('location').value = d.profile.location || '';
          document.getElementById('website').value = d.profile.website || '';
          document.getElementById('welcome-text').textContent = `Welcome, ${d.profile.displayName}!`;

          // Handle avatar display
          const avatarImg = document.getElementById('current-avatar');
          const avatarPlaceholder = document.getElementById('avatar-placeholder');
          const deleteBtn = document.getElementById('delete-avatar-btn');

          if (d.profile.avatarUrl) {
            avatarImg.src = d.profile.avatarUrl;
            avatarImg.style.display = 'block';
            avatarPlaceholder.style.display = 'none';
            deleteBtn.style.display = 'inline-block';
          } else {
            avatarImg.style.display = 'none';
            avatarPlaceholder.style.display = 'flex';
            avatarPlaceholder.textContent = (d.profile.displayName || d.profile.email || '?')[0].toUpperCase();
            deleteBtn.style.display = 'none';
          }
        }
      })
      .catch(e => showAlert(e.message, 'error'));

    document.getElementById('profile-form').addEventListener('submit', e => {
      e.preventDefault();
      fetch(`${API}/profile`, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          displayName: document.getElementById('displayName').value,
          bio: document.getElementById('bio').value,
          location: document.getElementById('location').value,
          website: document.getElementById('website').value
        })
      })
      .then(r => r.json())
      .then(d => d.success ? showAlert('Updated!') : showAlert(d.error, 'error'))
      .catch(e => showAlert(e.message, 'error'));
    });

    fetch(`${API}/settings`, { headers: { 'Authorization': `Bearer ${token()}` } })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          const s = d.settings;
          document.getElementById('account-email').textContent = s.email;
          document.getElementById('email-verified').innerHTML = s.emailVerified ? '<span class="badge success">✓</span>' : '<span class="badge warning">⚠</span>';
          document.getElementById('2fa-status').innerHTML = s.twoFactorEnabled ? '<span class="badge success">✓</span>' : '<span class="badge danger">✗</span>';
          document.getElementById('active-sessions').textContent = s.activeSessions;
          document.getElementById('providers-list').innerHTML = s.connectedProviders.length > 0 ? s.connectedProviders.map(p => `<span style="padding: 0.5rem 1rem; background: rgba(96, 165, 250, 0.2); border-radius: 8px; color: #60a5fa; margin-right: 0.5rem;">${p}</span>`).join('') : 'None';
        }
      });

    fetch(`${API}/security-logs?limit=20`, { headers: { 'Authorization': `Bearer ${token()}` } })
      .then(r => r.json())
      .then(d => {
        if (d.logs.length === 0) {
          document.getElementById('security-logs').innerHTML = '<p style="color: #64748b;">No events</p>';
          return;
        }

        document.getElementById('security-logs').innerHTML = d.logs.map(l => {
          let details = {};
          try {
            details = typeof l.details === 'string' ? JSON.parse(l.details) : l.details || {};
          } catch (e) {
            details = {};
          }

          const device = details.device || {};
          const geo = details.geolocation || {};
          const security = details.securityAnalysis || {};

          const riskBadge = security.riskLevel ?
            `<span class="badge ${security.riskLevel === 'critical' || security.riskLevel === 'high' ? 'danger' : security.riskLevel === 'medium' ? 'warning' : 'success'}" style="margin-left: 0.5rem;">${security.riskLevel.toUpperCase()}</span>` : '';

          const deviceInfo = device.browser || device.os ?
            `<div style="color: #94a3b8; font-size: 0.875rem; margin-top: 0.25rem;">
              ${device.browser ? `📱 ${device.browser}` : ''}
              ${device.os ? `• ${device.os}` : ''}
              ${device.type ? `• ${device.type}` : ''}
            </div>` : '';

          const locationInfo = geo.location ?
            `<div style="color: #94a3b8; font-size: 0.875rem; margin-top: 0.25rem;">
              📍 ${geo.location}
            </div>` : '';

          const securityFlags = security.flags && security.flags.length > 0 ?
            `<div style="margin-top: 0.5rem;">
              ${security.flags.map(flag =>
                `<span class="badge warning" style="font-size: 0.7rem; margin-right: 0.25rem;">⚠ ${flag.replace(/_/g, ' ')}</span>`
              ).join('')}
            </div>` : '';

          return `
          <div class="log-item">
            <div class="log-header">
              <span class="log-type">${l.event_type.split('_').map(w => w[0].toUpperCase() + w.slice(1)).join(' ')}${riskBadge}</span>
              <span class="log-time">${new Date(l.created_at * 1000).toLocaleString()}</span>
            </div>
            <div style="color: #94a3b8; font-size: 0.875rem;">IP: ${l.ip_address}</div>
            ${deviceInfo}
            ${locationInfo}
            ${securityFlags}
          </div>
          `;
        }).join('');
      });

    // Security log export handlers
    document.getElementById('export-csv-btn').addEventListener('click', () => {
      const btn = document.getElementById('export-csv-btn');
      btn.disabled = true;
      fetch(`${API}/security-logs/export?format=csv`, { headers: { 'Authorization': `Bearer ${token()}` } })
        .then(r => r.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `security-logs-${Date.now()}.csv`;
          a.click();
          showAlert('Security logs exported to CSV!');
        })
        .catch(e => showAlert(e.message, 'error'))
        .finally(() => btn.disabled = false);
    });

    document.getElementById('export-json-btn').addEventListener('click', () => {
      const btn = document.getElementById('export-json-btn');
      btn.disabled = true;
      fetch(`${API}/security-logs/export?format=json`, { headers: { 'Authorization': `Bearer ${token()}` } })
        .then(r => r.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `security-logs-${Date.now()}.json`;
          a.click();
          showAlert('Security logs exported to JSON!');
        })
        .catch(e => showAlert(e.message, 'error'))
        .finally(() => btn.disabled = false);
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const btn = document.getElementById('export-btn');
      btn.disabled = true;
      fetch(`${API}/export`, { headers: { 'Authorization': `Bearer ${token()}` } })
        .then(r => r.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `cybersmrt-${Date.now()}.json`;
          a.click();
          showAlert('Exported!');
        })
        .finally(() => btn.disabled = false);
    });

    document.getElementById('delete-account-btn').addEventListener('click', () => {
      const confirm = document.getElementById('delete-confirm').value;
      if (confirm !== 'DELETE MY ACCOUNT') return showAlert('Type "DELETE MY ACCOUNT"', 'error');
      if (!window.confirm('Sure?')) return;
      fetch(`${API}/account`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token()}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('delete-password').value, confirmDelete: confirm })
      })
      .then(r => r.json())
      .then(d => { localStorage.clear(); window.location.href = '/'; })
      .catch(e => showAlert(e.message, 'error'));
    });

    // Avatar upload functionality
    let selectedFile = null;

    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Validate file size
      if (file.size > 2 * 1024 * 1024) {
        showAlert('File too large. Maximum size is 2MB', 'error');
        return;
      }

      // Validate file type
      const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      if (!allowedTypes.includes(file.type)) {
        showAlert('Invalid file type. Use JPG, PNG, GIF, or WebP', 'error');
        return;
      }

      selectedFile = file;

      // Show preview
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('avatar-preview').src = e.target.result;
        document.getElementById('avatar-preview-container').style.display = 'block';
        document.getElementById('upload-avatar-btn').style.display = 'inline-block';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('upload-avatar-btn').addEventListener('click', async () => {
      if (!selectedFile) return;

      const uploadBtn = document.getElementById('upload-avatar-btn');
      const originalText = uploadBtn.textContent;
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<span class="loading"></span>Uploading...';

      try {
        const formData = new FormData();
        formData.append('avatar', selectedFile);

        const response = await fetch(`${API}/avatar/upload`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token()}` },
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          showAlert('Avatar uploaded successfully!');

          // Update UI
          const avatarImg = document.getElementById('current-avatar');
          const avatarPlaceholder = document.getElementById('avatar-placeholder');

          avatarImg.src = data.avatarUrl;
          avatarImg.style.display = 'block';
          avatarPlaceholder.style.display = 'none';

          document.getElementById('delete-avatar-btn').style.display = 'inline-block';
          document.getElementById('avatar-preview-container').style.display = 'none';
          document.getElementById('upload-avatar-btn').style.display = 'none';
          document.getElementById('avatar-input').value = '';
          selectedFile = null;
        } else {
          showAlert(data.error || 'Upload failed', 'error');
        }
      } catch (error) {
        showAlert(error.message, 'error');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = originalText;
      }
    });

    document.getElementById('delete-avatar-btn').addEventListener('click', async () => {
      if (!confirm('Delete your avatar?')) return;

      const deleteBtn = document.getElementById('delete-avatar-btn');
      deleteBtn.disabled = true;

      try {
        const response = await fetch(`${API}/avatar`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token()}` }
        });

        const data = await response.json();

        if (data.success) {
          showAlert('Avatar deleted successfully!');

          // Update UI
          const avatarImg = document.getElementById('current-avatar');
          const avatarPlaceholder = document.getElementById('avatar-placeholder');

          avatarImg.style.display = 'none';
          avatarPlaceholder.style.display = 'flex';

          // Get display name for placeholder initial
          const displayName = document.getElementById('displayName').value;
          avatarPlaceholder.textContent = (displayName || '?')[0].toUpperCase();

          deleteBtn.style.display = 'none';
        } else {
          showAlert(data.error || 'Delete failed', 'error');
        }
      } catch (error) {
        showAlert(error.message, 'error');
      } finally {
        deleteBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
