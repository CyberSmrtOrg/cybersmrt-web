<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CyberSmrt</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding-top: 90px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .page-header {
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .avatar-section {
      position: relative;
    }

    .avatar-large {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #60a5fa;
      object-fit: cover;
    }

    .avatar-upload {
      position: absolute;
      bottom: 0;
      right: 0;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px solid #0f172a;
      transition: transform 0.2s ease;
    }

    .avatar-upload:hover {
      transform: scale(1.1);
    }

    .avatar-upload svg {
      width: 18px;
      height: 18px;
      color: white;
    }

    .avatar-upload input {
      display: none;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h2 {
      font-size: 1.75rem;
      color: white;
      margin-bottom: 0.5rem;
    }

    .profile-info p {
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .badge {
      display: inline-block;
      padding: 0.375rem 0.875rem;
      background: rgba(96, 165, 250, 0.2);
      color: #60a5fa;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .form-section {
      margin-bottom: 2rem;
    }

    .form-section h3 {
      color: white;
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .form-section h3 svg {
      width: 20px;
      height: 20px;
      color: #60a5fa;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #60a5fa;
      background: rgba(15, 23, 42, 0.8);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }

    .form-group input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 2rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(96, 165, 250, 0.3);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .info-box {
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: start;
    }

    .info-box svg {
      width: 20px;
      height: 20px;
      color: #60a5fa;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .info-box p {
      color: #cbd5e1;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Header will be injected here -->
  <script defer src="/assets/js/header-loader.js"></script>

  <div class="container">
    <div class="page-header">
      <h1>Profile</h1>
      <p>Manage your personal information and preferences</p>
    </div>

    <div class="profile-card">
      <!-- Profile Header with Avatar -->
      <div class="profile-header">
        <div class="avatar-section">
          <img data-user-avatar src="/assets/logos/cybersmrt-logo-only.png" alt="Profile" class="avatar-large">
          <label class="avatar-upload">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <input type="file" accept="image/*" id="avatar-input">
          </label>
        </div>
        <div class="profile-info">
          <h2 data-user-name>User Name</h2>
          <p data-user-email>user@example.com</p>
          <span class="badge">Active Member</span>
        </div>
      </div>

      <!-- Personal Information -->
      <form id="profile-form">
        <div class="form-section">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Personal Information
          </h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="displayName">Display Name</label>
              <input type="text" id="displayName" name="displayName" placeholder="Your display name">
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" disabled placeholder="user@example.com">
            </div>
          </div>
          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" placeholder="Tell us about yourself..."></textarea>
          </div>
        </div>

        <!-- Contact Information -->
        <div class="form-section">
          <h3>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            Contact Information
          </h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
            </div>
            <div class="form-group">
              <label for="organization">Organization</label>
              <input type="text" id="organization" name="organization" placeholder="Your company or school">
            </div>
          </div>
        </div>

        <!-- Info Box -->
        <div class="info-box">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p>Your email address cannot be changed. If you need to update it, please contact support at <a href="mailto:tony@cybersmrt.org" style="color: #60a5fa;">tony@cybersmrt.org</a></p>
        </div>

        <!-- Action Buttons -->
        <div class="btn-group">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="location.reload()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Wait for auth.js to load, then check authentication
    function checkAuth() {
      if (window.requireAuth) {
        window.requireAuth();
      } else {
        // Auth.js not loaded yet, wait and retry
        setTimeout(checkAuth, 100);
      }
    }
    checkAuth();

    // Load user data
    window.addEventListener('load', () => {
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      if (user) {
        document.getElementById('displayName').value = user.displayName || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('bio').value = user.bio || '';
        document.getElementById('phone').value = user.phone || '';
        document.getElementById('organization').value = user.organization || '';
      }
    });

    // Handle form submission
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = {
        displayName: document.getElementById('displayName').value,
        bio: document.getElementById('bio').value,
        phone: document.getElementById('phone').value,
        organization: document.getElementById('organization').value
      };

      try {
        // You would replace this with your actual API call
        console.log('Saving profile data:', formData);

        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 500));

        alert('Profile updated successfully!');
      } catch (error) {
        console.error('Error updating profile:', error);
        alert('Failed to update profile. Please try again.');
      }
    });

    // Handle avatar upload
    document.getElementById('avatar-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Validate file type
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file');
        return;
      }

      // Validate file size (max 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('Image must be smaller than 5MB');
        return;
      }

      try {
        // Preview the image locally
        const reader = new FileReader();
        reader.onload = (e) => {
          document.querySelectorAll('[data-user-avatar]').forEach(el => {
            el.src = e.target.result;
          });
        };
        reader.readAsDataURL(file);

        // You would upload to your server here
        console.log('Uploading avatar:', file.name);

        alert('Avatar updated successfully!');
      } catch (error) {
        console.error('Error uploading avatar:', error);
        alert('Failed to upload avatar. Please try again.');
      }
    });
  </script>
</body>
</html>
