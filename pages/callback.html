<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing In... - CyberSmrt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .callback-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Orbitron', -apple-system, sans-serif;
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #666;
            margin-bottom: 0.5rem;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            color: #c33;
        }

        .error-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .retry-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #667eea;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .retry-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner"></div>
        <h1 id="status">Signing you in...</h1>
        <p id="message">Please wait while we complete the authentication</p>
        <div id="error" class="error" style="display: none;">
            <div class="error-title">Authentication Failed</div>
            <div id="error-message"></div>
            <a href="/login.html" class="retry-btn">Try Again</a>
        </div>
    </div>

    <script>
        // Handle OAuth callback
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');

            // Check for OAuth errors
            if (error) {
                showError(`OAuth Error: ${error}`);
                return;
            }

            // Check for required parameters
            if (!code || !state) {
                showError('Missing authentication parameters. Please try again.');
                return;
            }

            try {
                // Determine which provider based on the current path
                const path = window.location.pathname;
                let provider = 'google';
                if (path.includes('github')) provider = 'github';
                if (path.includes('microsoft')) provider = 'microsoft';

                // Exchange code for tokens via your auth worker
                const response = await fetch(`/auth/${provider}/callback?code=${code}&state=${state}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Authentication failed');
                }

                // Store tokens securely
                localStorage.setItem('access_token', data.tokens.accessToken);
                localStorage.setItem('refresh_token', data.tokens.refreshToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('session_id', data.session.id);

                // Update UI
                document.getElementById('status').textContent = 'Success!';
                document.getElementById('message').textContent = `Welcome, ${data.user.displayName}!`;

                // Redirect to dashboard after brief delay
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('Callback error:', err);
                showError(err.message || 'An unexpected error occurred');
            }
        }

        function showError(message) {
            document.querySelector('.spinner').style.display = 'none';
            document.getElementById('status').textContent = 'Oops!';
            document.getElementById('message').style.display = 'none';
            document.getElementById('error-message').textContent = message;
            document.getElementById('error').style.display = 'block';
        }

        // Run on page load
        handleCallback();
    </script>
</body>
</html>
