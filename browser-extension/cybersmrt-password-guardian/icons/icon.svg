<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient matching CyberSmrt brand -->
    <linearGradient id="cybersmrt-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e942ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle for contrast -->
  <circle cx="64" cy="64" r="60" fill="#1a1a2e"/>

  <!-- Shield outline -->
  <path d="M 64 20
           L 95 32
           C 95 32, 98 52, 98 65
           C 98 85, 64 105, 64 105
           C 64 105, 30 85, 30 65
           C 30 52, 33 32, 33 32
           Z"
        fill="none"
        stroke="url(#cybersmrt-gradient)"
        stroke-width="4"
        filter="url(#glow)"/>

  <!-- Left circuit pattern (magenta side) -->
  <g stroke="url(#cybersmrt-gradient)" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Top circuit node -->
    <circle cx="45" cy="45" r="4" fill="#e942ff"/>
    <line x1="45" y1="49" x2="45" y2="58"/>

    <!-- Middle circuit node -->
    <circle cx="45" cy="62" r="4" fill="#e942ff"/>
    <line x1="45" y1="66" x2="45" y2="75"/>

    <!-- Bottom circuit node -->
    <circle cx="45" cy="79" r="4" fill="#e942ff"/>

    <!-- Connecting lines -->
    <line x1="49" y1="45" x2="58" y2="45"/>
    <line x1="49" y1="62" x2="58" y2="62"/>
    <line x1="49" y1="79" x2="58" y2="79"/>
  </g>

  <!-- Right circuit pattern (blue side - "S" shape) -->
  <g stroke="url(#cybersmrt-gradient)" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Top curve -->
    <circle cx="75" cy="48" r="4" fill="#3b82f6"/>
    <path d="M 75 52 Q 75 58, 69 58"/>

    <!-- Middle node -->
    <circle cx="69" cy="62" r="4" fill="#8b5cf6"/>

    <!-- Bottom curve -->
    <path d="M 69 66 Q 69 72, 75 72"/>
    <circle cx="75" cy="76" r="4" fill="#3b82f6"/>
  </g>

  <!-- Central connection -->
  <line x1="58" y1="62" x2="65" y2="62"
        stroke="url(#cybersmrt-gradient)"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Small lock badge overlay for password theme -->
  <g transform="translate(85, 85)">
    <circle cx="0" cy="0" r="14" fill="#1a1a2e" stroke="url(#cybersmrt-gradient)" stroke-width="2"/>

    <!-- Lock body -->
    <rect x="-5" y="-2" width="10" height="8" rx="1" fill="url(#cybersmrt-gradient)"/>

    <!-- Lock shackle -->
    <path d="M -3 -2 L -3 -5 C -3 -6.5, -1.5 -7.5, 0 -7.5 C 1.5 -7.5, 3 -6.5, 3 -5 L 3 -2"
          fill="none"
          stroke="url(#cybersmrt-gradient)"
          stroke-width="1.5"
          stroke-linecap="round"/>
  </g>
</svg>
