<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - CyberSmrt</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .verify-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      text-align: center;
      color: white;
    }
    .verify-content {
      background: white;
      color: #333;
      padding: 40px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .success {
      color: #28a745;
      font-size: 48px;
      margin-bottom: 20px;
    }
    .error {
      color: #dc3545;
      font-size: 48px;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .resend-link {
      margin-top: 20px;
      color: #667eea;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>

  <!-- Google Analytics -->
  <script src="/assets/js/analytics-config.js"></script>
  <script src="/assets/js/analytics.js" defer></script>
</head>
<body>
  <div class="verify-container">
    <h1>Email Verification</h1>

    <div class="verify-content" id="verifyContent">
      <div class="spinner"></div>
      <p>Verifying your email address...</p>
    </div>
  </div>

  <script>
    const AUTH_API_URL = 'https://auth.cybersmrt.org';

    async function verifyEmail() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const content = document.getElementById('verifyContent');

      if (!token) {
        content.innerHTML = `
          <div class="error">⚠️</div>
          <h2>Invalid Link</h2>
          <p>This verification link is invalid or incomplete.</p>
          <a href="/login.html" class="btn">Go to Login</a>
        `;
        return;
      }

      try {
        const response = await fetch(`${AUTH_API_URL}/verify-email`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          content.innerHTML = `
            <div class="success">✓</div>
            <h2>Email Verified!</h2>
            <p>Your email has been successfully verified.</p>
            <p>Welcome to CyberSmrt, ${data.user.displayName || 'there'}!</p>
            <a href="/dashboard.html" class="btn">Go to Dashboard</a>
          `;
        } else {
          content.innerHTML = `
            <div class="error">✗</div>
            <h2>Verification Failed</h2>
            <p>${data.error || 'This verification link is invalid or has expired.'}</p>
            <p class="resend-link" onclick="showResendForm()">Request a new verification email</p>
            <a href="/login.html" class="btn">Go to Login</a>
          `;
        }
      } catch (error) {
        console.error('Verification error:', error);
        content.innerHTML = `
          <div class="error">✗</div>
          <h2>Verification Failed</h2>
          <p>An error occurred while verifying your email. Please try again later.</p>
          <a href="/login.html" class="btn">Go to Login</a>
        `;
      }
    }

    function showResendForm() {
      const content = document.getElementById('verifyContent');
      content.innerHTML = `
        <h2>Resend Verification Email</h2>
        <p>Enter your email address to receive a new verification link.</p>
        <input type="email" id="resendEmail" placeholder="your@email.com" style="width: 100%; padding: 12px; margin: 20px 0; border: 1px solid #ddd; border-radius: 5px;">
        <button onclick="resendVerification()" class="btn" style="width: 100%; border: none; cursor: pointer;">Send Verification Email</button>
        <div id="resendMessage" style="margin-top: 20px;"></div>
      `;
    }

    async function resendVerification() {
      const email = document.getElementById('resendEmail').value;
      const message = document.getElementById('resendMessage');

      if (!email) {
        message.innerHTML = '<p style="color: #dc3545;">Please enter your email address</p>';
        return;
      }

      try {
        const response = await fetch(`${AUTH_API_URL}/resend-verification`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          message.innerHTML = '<p style="color: #28a745;">✓ Verification email sent! Please check your inbox.</p>';
        } else {
          message.innerHTML = `<p style="color: #dc3545;">${data.error || 'Failed to send verification email'}</p>`;
        }
      } catch (error) {
        console.error('Resend error:', error);
        message.innerHTML = '<p style="color: #dc3545;">An error occurred. Please try again later.</p>';
      }
    }

    // Verify on page load
    verifyEmail();
  </script>
</body>
</html>
