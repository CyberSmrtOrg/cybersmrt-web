<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - CyberSmrt Store</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Theme System -->
  <link rel="stylesheet" href="/assets/css/theme.css">
  <script src="/assets/js/theme.js"></script>

  <!-- Load store's auth.js for cross-subdomain cookie support -->
  <script src="/assets/js/auth.js?v=2"></script>

  <!-- Header loader -->
  <script src="/assets/js/header-loader.js?v=5"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 80px auto 0;
      padding: 2rem 1rem;
    }

    .page-header {
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      gap: 1rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(96, 165, 250, 0.2);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      color: #60a5fa;
      margin-bottom: 1.5rem;
    }

    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: var(--text-bright);
    }

    .empty-state p {
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .empty-state a {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .empty-state a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }

    .order-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .order-card:hover {
      border-color: #60a5fa;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(96, 165, 250, 0.2);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-number {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-bright);
      font-family: 'Orbitron', monospace;
    }

    .order-status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .order-status.pending {
      background: rgba(250, 204, 21, 0.1);
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    .order-status.processing {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .order-status.fulfilled,
    .order-status.shipped {
      background: rgba(34, 197, 94, 0.1);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .order-status.cancelled {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .order-meta {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .order-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .order-meta-item svg {
      width: 16px;
      height: 16px;
    }

    .order-items-preview {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .order-item-preview {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: rgba(96, 165, 250, 0.05);
      border: 1px solid rgba(96, 165, 250, 0.1);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .order-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .order-card.expanded .order-details {
      max-height: 2000px;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
    }

    .order-details-section {
      margin-bottom: 1.5rem;
    }

    .order-details-section h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .order-details-section h3 svg {
      width: 18px;
      height: 18px;
      color: #60a5fa;
    }

    .order-item-full {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem;
      background: rgba(96, 165, 250, 0.03);
      border: 1px solid rgba(96, 165, 250, 0.1);
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    .order-item-info {
      flex: 1;
    }

    .order-item-title {
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 0.25rem;
    }

    .order-item-variant {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .order-item-price {
      text-align: right;
      font-weight: 600;
      color: var(--text-bright);
    }

    .order-item-quantity {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .shipping-address {
      padding: 1rem;
      background: rgba(96, 165, 250, 0.03);
      border: 1px solid rgba(96, 165, 250, 0.1);
      border-radius: 8px;
      line-height: 1.6;
      color: var(--text-primary);
    }

    .tracking-info {
      padding: 1rem;
      background: rgba(34, 197, 94, 0.05);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .tracking-number {
      font-family: 'Orbitron', monospace;
      font-weight: 600;
      color: #22c55e;
    }

    .track-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.25rem;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .track-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
    }

    .track-button svg {
      width: 16px;
      height: 16px;
    }

    .order-total {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      background: rgba(167, 139, 250, 0.05);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .order-total .label {
      color: #94a3b8;
    }

    .order-total .amount {
      color: #a78bfa;
      font-family: 'Orbitron', monospace;
    }

    .expand-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 0.5rem;
      transition: transform 0.3s ease;
    }

    .order-card.expanded .expand-icon {
      transform: rotate(180deg);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 1.5rem;
      border-radius: 12px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }

      .order-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .order-meta {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header will be injected here by header-loader.js -->

  <div class="container">
    <div class="page-header">
      <h1>My Orders</h1>
      <p>View and track your CyberSmrt store orders</p>
    </div>

    <div id="content-container">
      <!-- Loading state -->
      <div class="loading-container">
        <div class="spinner"></div>
        <p style="color: #94a3b8;">Loading your orders...</p>
      </div>
    </div>
  </div>

  <!-- Footer will be loaded here -->
  <script src="/assets/js/footer-loader.js"></script>

  <script>
    const STORE_API_URL = '/store';

    // Get current user (from auth.js)
    function getCurrentUser() {
      if (window.getCurrentUser) {
        return window.getCurrentUser();
      }

      const userStr = localStorage.getItem('user');
      if (userStr) {
        try {
          return JSON.parse(userStr);
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    // Format currency
    function formatCurrency(cents) {
      return '$' + (cents / 100).toFixed(2);
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Toggle order details
    function toggleOrderDetails(orderId) {
      const card = document.querySelector(`[data-order-id="${orderId}"]`);
      if (card) {
        card.classList.toggle('expanded');
      }
    }

    // Render orders
    function renderOrders(orders) {
      const container = document.getElementById('content-container');

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <h2>No purchases yet</h2>
            <p>When you make purchases from the CyberSmrt store, they'll appear here.</p>
            <a href="/store">Browse Store</a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(order => {
        const shippingAddr = order.shipping_address || {};
        const addressLines = [
          shippingAddr.name,
          shippingAddr.address?.line1,
          shippingAddr.address?.line2,
          [shippingAddr.address?.city, shippingAddr.address?.state, shippingAddr.address?.postal_code].filter(Boolean).join(', '),
          shippingAddr.address?.country
        ].filter(Boolean);

        const trackingSection = order.tracking_number ? `
          <div class="order-details-section">
            <h3>
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
              </svg>
              Tracking Information
            </h3>
            <div class="tracking-info">
              <div>
                <div style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 0.25rem;">Tracking Number</div>
                <div class="tracking-number">${order.tracking_number}</div>
              </div>
              ${order.tracking_url ? `
                <a href="${order.tracking_url}" target="_blank" rel="noopener" class="track-button">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                  Track Package
                </a>
              ` : ''}
            </div>
          </div>
        ` : '';

        return `
          <div class="order-card" data-order-id="${order.id}" onclick="toggleOrderDetails('${order.id}')">
            <div class="order-header">
              <div>
                <div class="order-number">
                  ${order.order_number || 'Order #' + order.id.substring(0, 8)}
                  <span class="expand-icon">▼</span>
                </div>
              </div>
              <div class="order-status ${order.status}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 16px; height: 16px;">
                  ${order.status === 'shipped' || order.status === 'fulfilled' ?
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>' :
                    '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>'
                  }
                </svg>
                ${order.status}
              </div>
            </div>

            <div class="order-meta">
              <div class="order-meta-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                ${formatDate(order.created_at)}
              </div>
              <div class="order-meta-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                ${formatCurrency(order.total_amount)}
              </div>
              <div class="order-meta-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
                ${order.items.length} ${order.items.length === 1 ? 'item' : 'items'}
              </div>
            </div>

            <div class="order-items-preview">
              ${order.items.slice(0, 3).map(item => `
                <div class="order-item-preview">
                  <strong>${item.quantity}x</strong>
                  ${item.product_title} - ${item.variant_title}
                </div>
              `).join('')}
              ${order.items.length > 3 ? `
                <div class="order-item-preview" style="color: #60a5fa;">
                  +${order.items.length - 3} more
                </div>
              ` : ''}
            </div>

            <div class="order-details">
              <div class="order-details-section">
                <h3>
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                  </svg>
                  Order Items
                </h3>
                ${order.items.map(item => `
                  <div class="order-item-full">
                    <div class="order-item-info">
                      <div class="order-item-title">${item.product_title}</div>
                      <div class="order-item-variant">${item.variant_title}</div>
                      <div class="order-item-quantity">Quantity: ${item.quantity}</div>
                    </div>
                    <div class="order-item-price">
                      ${formatCurrency(item.total_price)}
                      <div class="order-item-quantity">${formatCurrency(item.unit_price)} each</div>
                    </div>
                  </div>
                `).join('')}
                <div class="order-total">
                  <span class="label">Total</span>
                  <span class="amount">${formatCurrency(order.total_amount)}</span>
                </div>
              </div>

              <div class="order-details-section">
                <h3>
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                  Shipping Address
                </h3>
                <div class="shipping-address">
                  ${addressLines.join('<br>')}
                </div>
              </div>

              ${trackingSection}
            </div>
          </div>
        `;
      }).join('');
    }

    // Show error
    function showError(message) {
      const container = document.getElementById('content-container');
      container.innerHTML = `
        <div class="error-message">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 48px; height: 48px; margin: 0 auto 1rem;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p>${message}</p>
        </div>
      `;
    }

    // Helper to get cookie value
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    // Get access token from localStorage or cookies
    function getAccessToken() {
      // Try localStorage first
      const localToken = localStorage.getItem('accessToken');
      if (localToken) return localToken;

      // Try cookies as fallback (for cross-subdomain auth)
      const cookieToken = getCookie('accessToken');
      if (cookieToken) return cookieToken;

      return null;
    }

    // Load orders
    async function loadOrders() {
      try {
        const accessToken = getAccessToken();
        console.log('🔍 Access token found:', accessToken ? 'YES' : 'NO');
        console.log('🔍 localStorage accessToken:', localStorage.getItem('accessToken') ? 'YES' : 'NO');
        console.log('🔍 Cookie accessToken:', getCookie('accessToken') ? 'YES' : 'NO');
        console.log('🔍 All cookies:', document.cookie);

        // Build headers - include Authorization if we have a token in localStorage
        const headers = {};
        if (accessToken) {
          headers['Authorization'] = `Bearer ${accessToken}`;
          console.log('✅ Added Authorization header');
        } else {
          console.warn('⚠️ No access token found - relying on HttpOnly cookies');
        }

        console.log('📡 Fetching orders from:', `${STORE_API_URL}/api/orders`);

        // Make request - HttpOnly cookies will be sent automatically with credentials: 'include'
        // The store-api will check both Authorization header and cookies
        const response = await fetch(`${STORE_API_URL}/api/orders`, {
          headers: headers,
          credentials: 'include' // Send HttpOnly cookies automatically
        });

        console.log('📬 Response status:', response.status);

        if (!response.ok) {
          if (response.status === 401) {
            showError('Please sign in to view your purchases.');
          } else {
            const errorText = await response.text();
            console.error('❌ Error response:', errorText);
            throw new Error('Failed to load orders');
          }
          return;
        }

        const data = await response.json();
        console.log('📦 Response data:', data);
        renderOrders(data.orders);

      } catch (error) {
        console.error('Error loading orders:', error);
        showError('Failed to load your orders. Please try again later.');
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Wait a bit for auth to initialize
      setTimeout(loadOrders, 500);
    });
  </script>

</body>
</html>
